name: ReturnReady narration transcription check
on:
  push:
    branches: [media/returnready-clear-20260909]
    paths: [.github/workflows/returnready-voice-audit.yml]
permissions:
  contents: read
  actions: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: returnready-clear-voice
          path: voice-input
          run-id: 34399273071
          github-token: ${{ github.token }}
      - name: Install independent speech recognizer
        run: python -m pip install 'faster-whisper==1.1.0' requests
      - name: Transcribe each narration file with no supplied reference prompt
        run: |
          python - <<'PY'
          from pathlib import Path
          from faster_whisper import WhisperModel
          from difflib import SequenceMatcher
          import json,re,hashlib
          root=Path('voice-input');out=Path('audio-audit');out.mkdir()
          source=json.loads((root/'voice-generation.json').read_text())
          model=WhisperModel('base.en',device='cpu',compute_type='int8',cpu_threads=2)
          rows=[]
          def words(s):return re.findall(r"[a-z0-9]+",s.lower())
          for row in source['scenes']:
              file=root/row['file'];assert hashlib.sha256(file.read_bytes()).hexdigest()==row['sha256']
              segments,_=model.transcribe(str(file),language='en',beam_size=5,condition_on_previous_text=False,word_timestamps=True)
              segments=list(segments);heard=' '.join(s.text.strip() for s in segments)
              score=SequenceMatcher(None,words(row['text']),words(heard)).ratio()
              result={'scene':row['index'],'intended':row['text'],'recognized':heard,'word_sequence_similarity':score,'segments':[{'start':s.start,'end':s.end,'text':s.text,'words':[{'start':w.start,'end':w.end,'word':w.word,'probability':w.probability} for w in s.words or []]} for s in segments]}
              rows.append(result);print(json.dumps(result),flush=True)
          report={'scope':'Audio intelligibility diagnostic only, not a human listening review or product validation. No reference text was supplied to the recognizer.','model':'faster-whisper base.en, CPU int8','scenes':rows}
          (out/'transcription-check.json').write_text(json.dumps(report,indent=2))
          assert len(rows)==7 and all(r['word_sequence_similarity']>.85 for r in rows), 'Review transcription differences before publishing.'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: returnready-narration-audit
          path: audio-audit/
          retention-days: 14
