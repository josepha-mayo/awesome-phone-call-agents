name: Prepare verified ReturnReady contribution
on:
  push:
    branches: [ci/returnready-import]
    paths: [.github/workflows/returnready-import.yml]
permissions:
  contents: write
concurrency:
  group: returnready-contribution-import
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'josepha-mayo/awesome-phone-call-agents'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8f75267dda86c7261ad4f079b28db30a9df67e1b
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Validate the upstream baseline and branch names
        run: |
          mkdir -p /tmp/returnready-verification
          python3 scripts/check_branch_name.py --branch ci/returnready-import
          python3 scripts/check_branch_name.py --branch feat/returnready-review
          python3 scripts/validate_repository.py > /tmp/returnready-verification/upstream-baseline.log 2>&1
      - uses: actions/checkout@v4
        with:
          repository: josepha-mayo/Joseph-Portfolio
          ref: 6a5ea6515219f1feb273288a7e4e27d3417de493
          path: _returnready_source
          persist-credentials: false
      - name: Import only the reviewed app, tests and provenance
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,shutil,re,subprocess
          source=Path('_returnready_source/apps/python/returnready')
          target=Path('apps/python/returnready')
          assert not target.exists(), 'Do not overwrite an existing contribution'
          names=['LICENSE','README.md','returnready.py','test_returnready.py','http_test.py','test_completion.py','browser_completion.py','web/index.html','docs/PROTOTYPE-README.md','docs/baseline-source-hashes.json','docs/LIVE-TEST-HANDOFF.md','evidence03/release.json','evidence03/browser-http.json']
          hashes={'returnready.py':'d035e11c6a0f85d07a7dde54fd385bdfed3fdc9af78a6ff56463186ef819a2af','test_returnready.py':'ef1d2da7be0c8d47eaa432ee603a9e9c233169d0cfab05641e10451c13ce6291','http_test.py':'f6318268a73a9a28997e7ad46a5daa8b9253a886ee91a3ab297fe8273a2687d8','test_completion.py':'7e2ffb38917bae4be08da8d77ba64e3de80b87e20ef8dd8e40291b873aec33bc','browser_completion.py':'9d5c1d29085f757e461d33195d4880d790eca8eeea2eb38af4955f19306f4c2a','web/index.html':'101da8a7ba70552c66164f69a92c171c9fd6a021a7e67376801e4ffa064ea308'}
          for name in names:
            p=source/name
            assert p.is_file() and not p.is_symlink()
            if name in hashes: assert hashlib.sha256(p.read_bytes()).hexdigest()==hashes[name],name
            dest=target/name;dest.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(p,dest)
          p=target/'README.md';s=p.read_text()
          s=s.replace('`docs/PROTOTYPE-README.md` and `evidence/` preserve the recovered prototype\'s documentation and execution records.', '`docs/PROTOTYPE-README.md` preserves the recovered prototype documentation; prior execution records remain in the pinned source history. The small `evidence03/` records document the no-call candidate checks.')
          s=s.replace('The latest `evidence03/release.json` records the actual repeated gate for this candidate. The original v0.1 browser files remain historical and are not claimed as passing against changed stale-export behavior.', 'The historical `evidence03/release.json` records the candidate gate before this upstream contribution. `evidence03/upstream-verification.json` records revalidation on the upstream base. The old v0.1 browser files are intentionally not included as current regressions.')
          s=s.replace('Test-only browser dependencies are pinned in the CI workflow.', 'For the browser checks, install `playwright==1.55.0` and run `python -m playwright install chromium`. Browser tests also accept `CHROMIUM_EXECUTABLE`. The actual HTTP test is authoritative; `--isolated` is an explicitly labelled fallback, not an HTTP verification.')
          start=s.index('## Contribution and final-entry gates')
          end=s.index('## Provenance, privacy and limits', start)
          s=s[:start]+'## Contribution scope and live-service status\n\nThis is a runnable application contribution under `apps/python/returnready/`. It is submitted as inspectable no-call code, not evidence of a completed competition entry. A supported authenticated CALL-E test and result, confirmed account details and live-workflow demonstration remain unverified. A synthetic review example must not be represented as a live merchant conversation.\n\n'+s[end:]
          p.write_text(s)
          p=target/'docs/LIVE-TEST-HANDOFF.md';s=p.read_text()
          s=s.replace('CALL-E MCP plan `pKQNCTP62` again returned NG/English unsupported', 'The tested CALL-E MCP interface returned NG/English unsupported')
          s=s.replace("Use Joseph's own consenting Nigerian phone or another explicitly authorized recipient.", 'Use an explicitly authorized recipient in a supported region, with truthful country and timezone details.')
          p.write_text(s)
          p=Path('README.md');s=p.read_text();entry='- [ReturnReady](apps/python/returnready/) - Local return-enquiry review workbench that compares recipient quotations and later corrections with written instructions, with no-call examples and explicit approval before CALL-E requests.'
          assert s.count('### Apps\n')==1 and 'apps/python/returnready/' not in s
          p.write_text(s.replace('### Apps\n','### Apps\n\n'+entry,1))
          (target/'.gitignore').write_text('__pycache__/\n*.pyc\n*.sqlite*\n*.db*\nevidence03/*.png\nevidence03/*.log\nevidence03/test-session.json\n')
          (target/'docs/import-provenance.json').write_text(json.dumps({'source_repository':'josepha-mayo/Joseph-Portfolio','source_commit':'6a5ea6515219f1feb273288a7e4e27d3417de493','upstream_base':'8f75267dda86c7261ad4f079b28db30a9df67e1b','unchanged_runtime_and_test_sha256':hashes,'changes':'Contribution-only README and handoff edits, no runtime or test changes; no private contact/plan identifiers, images or unrelated portfolio files imported.'},indent=2)+'\n')
          shutil.rmtree('_returnready_source')
          # Check for genuine contact identifiers accidentally copied from the private handoff.
          for p in target.rglob('*'):
            if p.is_file():
              text=p.read_text()
              assert not re.search(r'(?<!\d)(?:\+234\d{10}|0[789]\d{9})(?!\d)',text),p
              assert 'pKQNCTP62' not in text and 'ayandajoseph390@gmail.com' not in text,p
          subprocess.run(['git','switch','-c','feat/returnready-review'],check=True)
          PY
      - name: Run actual no-call unit and HTTP tests
        run: |
          env -u CALLE_API_KEY python3 -m unittest test_returnready http_test test_completion -v > /tmp/returnready-verification/app-tests.log 2>&1
        working-directory: apps/python/returnready
      - name: Install the browser without provider credentials
        run: |
          python3 -m venv /tmp/returnready-browser
          /tmp/returnready-browser/bin/pip -q install playwright==1.55.0
          /tmp/returnready-browser/bin/python -m playwright install --with-deps chromium
      - name: Verify the real Python server and UI
        working-directory: apps/python/returnready
        run: env -u CALLE_API_KEY /tmp/returnready-browser/bin/python browser_completion.py > /tmp/returnready-verification/browser.log 2>&1
      - name: Validate repository and record the exact candidate
        run: |
          python3 scripts/validate_repository.py > /tmp/returnready-verification/upstream-with-app.log 2>&1
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          import hashlib,json,re,subprocess
          app=Path('apps/python/returnready');logs=Path('/tmp/returnready-verification')
          txt=(logs/'app-tests.log').read_text();assert re.search(r'Ran 92 tests',txt) and txt.rstrip().endswith('OK')
          ui=json.loads((app/'evidence03/browser-http.json').read_text());assert ui['status']=='passed' and ui['count']==18
          provenance=json.loads((app/'docs/import-provenance.json').read_text())
          for name,h in provenance['unchanged_runtime_and_test_sha256'].items():assert hashlib.sha256((app/name).read_bytes()).hexdigest()==h,name
          summary={'status':'passed','checked_at':datetime.now(timezone.utc).isoformat(),'upstream_base':provenance['upstream_base'],'source_commit':provenance['source_commit'],'repository_validation':'passed before and after importing the app; validation scripts unchanged','python_unit_and_http_tests':92,'browser_workflows':18,'browser_mode':'actual local HTTP with default security policy','runtime_and_tests_match_reviewed_candidate':True,'live_provider_calls':0,'provider_live_verified':False,'scope':'No-call synthetic fixtures and local HTTP. Upstream PR and competition acceptance are separate statuses.'}
          (app/'evidence03/upstream-verification.json').write_text(json.dumps(summary,indent=2)+'\n')
          (logs/'upstream-verification.json').write_text(json.dumps(summary,indent=2)+'\n')
          subprocess.run(['git','add','README.md',str(app)],check=True)
          names=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert names and all(n=='README.md' or n.startswith('apps/python/returnready/') for n in names),names
          assert not any(n.endswith(('.png','.zip','.sqlite','.db')) for n in names)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          print(json.dumps(summary))
          PY
      - name: Publish only the scoped contribution branch on the fork
        run: |
          git config user.name 'josepha-mayo'
          git config user.email '192471872+josepha-mayo@users.noreply.github.com'
          git commit -m 'feat(apps): add returnready source-linked return review'
          git push origin HEAD:feat/returnready-review
          git rev-parse HEAD > /tmp/returnready-verification/head-commit.txt
          git diff 8f75267dda86c7261ad4f079b28db30a9df67e1b HEAD --stat > /tmp/returnready-verification/diff-stat.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: returnready-upstream-verification
          path: |
            /tmp/returnready-verification/
            apps/python/returnready/
          retention-days: 14
